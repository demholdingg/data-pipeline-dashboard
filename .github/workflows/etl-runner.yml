name: Data Extraction Pipeline (PoC)

on:
  workflow_dispatch: # Tetap ada untuk menjalankan manual
  push:
    branches:
      - master

jobs:
  extract-and-load:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Environment (Python)
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Skrip Uji Coba
        run: python scripts/dummy-pull.py
